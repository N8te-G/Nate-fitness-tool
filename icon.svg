<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Nate's Fitness Tool app icon: two heart-rate traces (two devices) on a sunset gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A5B"/><stop offset="0.5" stop-color="#F43F5E"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#3B0764" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#hl)"/>
  <g filter="url(#sh)" fill="none" stroke-width="26" stroke-linecap="round">
    <path d="M112 316 C 166 316, 186 226, 240 226 S 302 352, 352 318 S 386 240, 400 236" stroke="#1E1B4B"/>
    <path d="M112 262 C 166 262, 182 168, 236 168 S 300 300, 350 262 S 384 182, 400 176" stroke="#FFFFFF"/>
  </g>
  <circle cx="400" cy="236" r="13" fill="#1E1B4B"/>
  <circle cx="400" cy="176" r="17" fill="#FFFFFF"/>
</svg>
